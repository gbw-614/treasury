services:
  app:
    build:
      context: .
    ports:
      - "${VERIFICATION_PORT:-8000}:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.5-flash}
      VERIFICATION_DATA_DIR: /data
      VERIFICATION_BOOTSTRAP_USERNAME: ${VERIFICATION_BOOTSTRAP_USERNAME:-}
      VERIFICATION_BOOTSTRAP_PASSWORD: ${VERIFICATION_BOOTSTRAP_PASSWORD:-}
      VERIFICATION_BOOTSTRAP_PASSWORD_FILE: ${VERIFICATION_BOOTSTRAP_PASSWORD_FILE:-}
      VERIFICATION_SESSION_SECURE: ${VERIFICATION_SESSION_SECURE:-false}
      VERIFICATION_SESSION_HOURS: ${VERIFICATION_SESSION_HOURS:-12}
      VERIFICATION_S3_CATALOG_URL: ${VERIFICATION_S3_CATALOG_URL:-}
      VERIFICATION_ANALYSIS_CONCURRENCY: ${VERIFICATION_ANALYSIS_CONCURRENCY:-1}
      VERIFICATION_OCR_CONCURRENCY: ${VERIFICATION_OCR_CONCURRENCY:-1}
      VERIFICATION_VISION_CONCURRENCY: ${VERIFICATION_VISION_CONCURRENCY:-3}
    volumes:
      - treasury-data:/data
    restart: unless-stopped

volumes:
  treasury-data:
