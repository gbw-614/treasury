[project]
name = "ttb-label-verification-api"
version = "0.1.0"
description = "Local FastAPI service for the TTB label verification vertical slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "rapidfuzz>=3.14,<4",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.10.0",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection contract intentionally uses Depends() as a
# parameter default throughout route declarations.
"app/main.py" = ["B008"]
